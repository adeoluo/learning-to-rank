name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: format, lint, type, test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (builds the Rust core)
        run: uv sync --all-extras --dev --python ${{ matrix.python-version }}

      - name: Format check (ruff)
        run: uv run --no-sync ruff format --check .

      - name: Lint (ruff)
        run: uv run --no-sync ruff check .

      - name: Type check (mypy)
        run: uv run --no-sync mypy src

      - name: Test (+ coverage gate)
        env:
          LTR_REQUIRE_RUST: "1"
        run: uv run --no-sync pytest --cov=src --cov-report=xml --cov-report=term-missing --cov-fail-under=80

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  rust:
    name: rust core and parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Format, lint and unit tests
        working-directory: rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features python -- -D warnings
          cargo test

      - name: Build the package with its Rust core
        run: uv sync --dev --python 3.12

      - name: Parity tests (Rust vs numpy reference)
        env:
          LTR_REQUIRE_RUST: "1"
        run: uv run --no-sync pytest tests/test_rust_parity.py -v

  validation:
    name: reference libraries (LightGBM, XGBoost, scikit-learn, ranx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: uv sync --all-extras --dev --group validation --python 3.12

      - name: Validation tests
        env:
          LTR_REQUIRE_RUST: "1"
        run: uv run --no-sync pytest -m validation -v

  build:
    name: build (package + image)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build package
        run: uv build
      - name: Build Docker image
        run: docker build -t ${{ github.event.repository.name }}:ci .
