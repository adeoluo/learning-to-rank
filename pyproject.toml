[project]
name = "learning-to-rank"
version = "0.1.0"
description = "LambdaMART with a Rust histogram core, neural rankers, click models and unbiased learning to rank"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Adeolu Ogunnoiki" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
# Neural rankers (pointwise, pairwise, listwise) and unbiased neural training: uv sync --extra neural
neural = [
    "torch>=2.2",
]
# Reading the MSLR-WEB10K parquet mirror: uv sync --extra data
data = [
    "pyarrow>=15",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.14",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "scipy>=1.11",
]
# Rebuild the Rust core in place while editing it: make rust-develop
rust = [
    "maturin>=1.7,<2",
]
# Reference libraries for comparison benchmarks and opt-in parity tests.
validation = [
    "lightgbm>=4.3",
    "xgboost>=2.1",
    "scikit-learn>=1.5",
    "ranx>=0.3.20",
]

[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

# The Rust core (rust/) is compiled into the package as `learning_to_rank.learning_to_rank_rs`,
# so every install uses it; the numpy implementation stays as the reference.
[tool.maturin]
python-source = "src"
manifest-path = "rust/Cargo.toml"
module-name = "learning_to_rank.learning_to_rank_rs"
features = ["python"]

[tool.uv]
# Rebuild the extension when the Rust sources change.
cache-keys = [{ file = "pyproject.toml" }, { file = "rust/Cargo.toml" }, { file = "rust/src/**/*.rs" }]

# CPU wheels for torch on Linux (CI and Docker); macOS wheels come from PyPI and include MPS.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Mathematical names (X for a feature matrix) follow the usual notation.
"**/*.py" = ["N803", "N806"]

[tool.ruff.lint.isort]
known-first-party = ["learning_to_rank"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = false
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "learning_to_rank.learning_to_rank_rs",
    "lightgbm.*",
    "xgboost.*",
    "sklearn.*",
    "scipy.*",
    "ranx.*",
    "pyarrow.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra -q -p no:cacheprovider --basetemp=.pytest-tmp"
markers = [
    "slow: larger-scale tests",
    "validation: comparisons with reference libraries (uv sync --group validation)",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
branch = true
